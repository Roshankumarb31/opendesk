name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --windowed --name "OpenDesk_${{ github.ref_name }}_win64" --icon=assets/launcher.ico main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OpenDesk_Windows
          path: dist/OpenDesk_*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --onefile --name "OpenDesk_${{ github.ref_name }}_linux" main.py

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: OpenDesk_Linux
          path: dist/OpenDesk_*_linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenDesk_Windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: OpenDesk_Linux
          path: artifacts/linux

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/linux/*
          generate_release_notes: true
